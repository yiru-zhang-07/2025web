<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .frame { fill: #f9f9f9; stroke: #ccc; stroke-width: 2; rx: 20; }
    .search { fill: #fff; stroke: #aaa; stroke-width: 1; rx: 8; }
    .result { fill: #eaeaea; rx: 6; animation: fadeIn 4s infinite; }
    .search-icon { fill: #666; }
    .panel { fill: #f0f0f0; }
    @keyframes fadeIn {
      0%, 70% { opacity: 0; }
      30%, 50% { opacity: 1; }
    }
  </style>
  
  <!-- Mobile Frame -->
  <rect x="50" y="50" width="200" height="300" class="frame"/>
  <!-- Mobile Search Bar -->
  <rect x="70" y="70" width="160" height="30" class="search"/>
  <!-- Mobile Search Icon -->
  <circle cx="85" cy="85" r="6" class="search-icon"/>
  <path d="M88 88 L95 95" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Mobile Results (animated boxes) -->
  <rect x="70" y="120" width="160" height="25" class="result" style="animation-delay: 0s;"/>
  <rect x="70" y="160" width="160" height="25" class="result" style="animation-delay: 1.3s;"/>
  <rect x="70" y="200" width="160" height="25" class="result" style="animation-delay: 2.6s;"/>
  
  <!-- Desktop Frame -->
  <rect x="350" y="50" width="400" height="300" class="frame"/>
  <!-- Desktop Search Bar -->
  <rect x="370" y="70" width="360" height="30" class="search"/>
  <!-- Desktop Search Icon -->
  <circle cx="385" cy="85" r="6" class="search-icon"/>
  <path d="M388 88 L395 95" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Filter Panel -->
  <rect x="370" y="120" width="100" height="200" class="panel"/>
  <!-- Desktop Results -->
  <rect x="490" y="120" width="220" height="40" class="result"/>
  <rect x="490" y="170" width="220" height="40" class="result"/>
  <rect x="490" y="220" width="220" height="40" class="result"/>
</svg>